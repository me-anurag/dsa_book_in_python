<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140"
     role="img" aria-label="Re-solve schedule: day 1, 3, 7, 21">
  <style>
    .day  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #22c55e; text-anchor: middle; }
    .note { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #64748b; text-anchor: middle; }
    .track { stroke: #334155; stroke-width: 4; stroke-linecap: round; }
    .fill { stroke: #22c55e; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 720;
             animation: draw 4.8s ease-in-out infinite; }
    .dot  { animation: blink 4.8s ease-in-out infinite; opacity: 0.15; }
    @keyframes draw  { 0% { stroke-dashoffset: 720; } 75%, 100% { stroke-dashoffset: 0; } }
    @keyframes blink { 0% { opacity: 0.15; } 8%, 70% { opacity: 1; } 100% { opacity: 0.15; } }
  </style>
  <line class="track" x1="140" y1="60" x2="860" y2="60"/>
  <line class="fill" x1="140" y1="60" x2="860" y2="60"/>
  <g class="node" style="animation-delay:0.0s">
    <circle cx="140" cy="60" r="16" fill="#0b1120" stroke="#22c55e" stroke-width="3"/>
    <circle class="dot" cx="140" cy="60" r="8" fill="#22c55e" style="animation-delay:0.0s"/>
    <text class="day" x="140" y="104">Day 1</text>
    <text class="note" x="140" y="126">solve + re-code</text>
  </g>
  <g class="node" style="animation-delay:1.2s">
    <circle cx="380" cy="60" r="16" fill="#0b1120" stroke="#22c55e" stroke-width="3"/>
    <circle class="dot" cx="380" cy="60" r="8" fill="#22c55e" style="animation-delay:1.2s"/>
    <text class="day" x="380" y="104">Day 3</text>
    <text class="note" x="380" y="126">state complexity</text>
  </g>
  <g class="node" style="animation-delay:2.4s">
    <circle cx="620" cy="60" r="16" fill="#0b1120" stroke="#22c55e" stroke-width="3"/>
    <circle class="dot" cx="620" cy="60" r="8" fill="#22c55e" style="animation-delay:2.4s"/>
    <text class="day" x="620" y="104">Day 7</text>
    <text class="note" x="620" y="126">faster, no notes</text>
  </g>
  <g class="node" style="animation-delay:3.5999999999999996s">
    <circle cx="860" cy="60" r="16" fill="#0b1120" stroke="#22c55e" stroke-width="3"/>
    <circle class="dot" cx="860" cy="60" r="8" fill="#22c55e" style="animation-delay:3.5999999999999996s"/>
    <text class="day" x="860" y="104">Day 21</text>
    <text class="note" x="860" y="126">owned ✓</text>
  </g>
</svg>
