<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="128" viewBox="0 0 1000 128"
     role="img" aria-label="32 chapters, 119 problems, 17 pattern chapters, 5 appendices">
  <style>
    .num { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 40px; font-weight: 800; text-anchor: middle; }
    .lab { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #64748b; text-anchor: middle; }
    .card { animation: rise 0.9s ease-out both; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.2s ease-out both,
            pulse 3s ease-in-out 2s infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
  <g class="card" style="animation-delay:0.0s">
    <rect x="30" y="12" width="220" height="104" rx="16" fill="#0ea5e9" fill-opacity="0.10"
          stroke="#0ea5e9" stroke-width="2"/>
    <text class="num" x="140.0" y="66" fill="#0ea5e9">32</text>
    <text class="lab" x="140.0" y="96">chapters</text>
    <rect class="bar" x="54" y="104" width="172" height="4" rx="2" fill="#0ea5e9"
          style="animation-delay:0.6s"/>
  </g>
  <g class="card" style="animation-delay:0.25s">
    <rect x="270" y="12" width="220" height="104" rx="16" fill="#22c55e" fill-opacity="0.10"
          stroke="#22c55e" stroke-width="2"/>
    <text class="num" x="380.0" y="66" fill="#22c55e">119</text>
    <text class="lab" x="380.0" y="96">LeetCode problems</text>
    <rect class="bar" x="294" y="104" width="172" height="4" rx="2" fill="#22c55e"
          style="animation-delay:0.85s"/>
  </g>
  <g class="card" style="animation-delay:0.5s">
    <rect x="510" y="12" width="220" height="104" rx="16" fill="#f59e0b" fill-opacity="0.10"
          stroke="#f59e0b" stroke-width="2"/>
    <text class="num" x="620.0" y="66" fill="#f59e0b">17</text>
    <text class="lab" x="620.0" y="96">pattern chapters</text>
    <rect class="bar" x="534" y="104" width="172" height="4" rx="2" fill="#f59e0b"
          style="animation-delay:1.1s"/>
  </g>
  <g class="card" style="animation-delay:0.75s">
    <rect x="750" y="12" width="220" height="104" rx="16" fill="#a855f7" fill-opacity="0.10"
          stroke="#a855f7" stroke-width="2"/>
    <text class="num" x="860.0" y="66" fill="#a855f7">5</text>
    <text class="lab" x="860.0" y="96">appendices</text>
    <rect class="bar" x="774" y="104" width="172" height="4" rx="2" fill="#a855f7"
          style="animation-delay:1.35s"/>
  </g>
</svg>
